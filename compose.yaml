
services:
  accounts-db:
    image: postgres:18-alpine
    container_name: accounts-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: accounts_db
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: accounts

    ports:
      - "5432:5432"

    volumes:
      - accounts-db-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounts -d accounts_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://accounts-db:5432/keycloak_db
      KC_DB_USERNAME: accounts
      KC_DB_PASSWORD: accounts
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_PORT: "8080"

    ports:
      - "8080:8080"

    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

    depends_on:
      accounts-db:
        condition: service_healthy

volumes:
  accounts-db-data:
